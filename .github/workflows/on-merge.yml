name: on-merge

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/**'

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.GH_ORGANIZATION_TFSTATE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.GH_ORGANIZATION_TFSTATE_AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.MINERVA_SAMA_APP_ID }}
          private-key: ${{ secrets.MINERVA_SAMA_APP_PRIVATE_KEY }}
          owner: bright-room

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.2

      - name: Terraform Init
        run: terraform init -lockfile=readonly

      - name: Terraform apply
        id: apply
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: terraform apply -no-color -auto-approve

      - name: Trigger fanout sync
        env:
          FANOUT_URL: https://repository-fanout.bright-room.workers.dev
          ACCOUNT: bright-room
          GITHUB_SHA: ${{ github.sha }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/fanout-sync.sh"
