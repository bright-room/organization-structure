name: on-pull-request

on:
  pull_request:

permissions: {}

jobs:
  check-code-style:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2

      - name: Check code-style
        run: terraform fmt -recursive -check

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.GH_ORGANIZATION_TFSTATE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.GH_ORGANIZATION_TFSTATE_AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2

      - name: Terraform Init (Check Lockfile)
        run: terraform init -lockfile=readonly

      - name: Terraform validate
        run: terraform validate -no-color

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: terraform
    needs:
      - check-code-style
      - validate
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.GH_ORGANIZATION_TFSTATE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.GH_ORGANIZATION_TFSTATE_AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        # 組織全体を terraform で管理するため、トークンの対象リポも権限も絞れない
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 # zizmor: ignore[github-app]
        with:
          app-id: ${{ vars.MINERVA_SAMA_APP_ID }}
          private-key: ${{ secrets.MINERVA_SAMA_APP_PRIVATE_KEY }}
          owner: bright-room # zizmor: ignore[github-app] 同上(組織全体が対象)

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2

      - name: Terraform Init
        run: terraform init -lockfile=readonly

      - name: Terraform plan
        id: plan
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: terraform plan -no-color -detailed-exitcode -out=tfplan

      # action は terraform を実行しないため、show の出力をファイルに書いて渡す。
      # composite action 内のステップは working-directory を引き継がないので絶対パスにする。
      - name: Terraform show
        if: steps.plan.outputs.exitcode == '2'
        run: |
          terraform show -json tfplan > "${RUNNER_TEMP}/plan.json"
          terraform show -no-color tfplan > "${RUNNER_TEMP}/plan.txt"

      - name: Comment plan result
        uses: kukv/terraform-plan-comment-action@9e0f42a0e418a10d7505a4978ebcdf9143bfaaaa # v1.0.0
        with:
          exitcode: ${{ steps.plan.outputs.exitcode }}
          plan-json: ${{ runner.temp }}/plan.json
          plan-text: ${{ runner.temp }}/plan.txt
          error-message: ${{ steps.plan.outputs.stderr }}
          github-token: ${{ steps.app-token.outputs.token }}

      # -detailed-exitcode では変更ありが 2 で返るため、outcome ではなく exitcode で判定する
      - name: Fail if plan failed
        if: steps.plan.outputs.exitcode != '0' && steps.plan.outputs.exitcode != '2'
        run: |
          echo "::error::terraform plan failed"
          exit 1
